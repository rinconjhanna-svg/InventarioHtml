<!DOCTYPE html>
<html lang="es">
<head>     
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion Inventario ADSO</title>
    <!--CSS de Bootstrap 5.3.3 desde url predeterminada-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Libreria de iconos de bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet"><!--llama los estilos personalizados-->
</head>
<body class="bg-body-tertiary">
    <!--menu lateral-->
    <!--offcanvas en pantallas menores al lg es un panel oculto que se desliza-->
    <!--desde el lg se muestra normal. offcanvas-start lo hace salir por la izaquierda . siberdar es
    muestrala clase el id el boton q lo abre-->

    <aside class="offcanvas-lg offcanvas-start siderbar" tabindex="-1" id="menuLateral"
    aria-labelledby="tituloMenu">
        <!--encabezado del panel; bootstrap solo lo muestra en celular-->
        <div class="offcanvas-header border-bottom border-secondary">
            <!--nombre del sistema en el panel movil-->
            <h5 class="offcanvas-title" id="tituloMenu"><i class="bi bi-shop me-2"></i>Tienda Sena</h5>
            <!--boton x blanco de cierre del panel-->
            <button type="button" class="btn-close
            btn-close-white"
            data-bs-dismiss="offcanvas"
            data-bs-target="#menuLateral"
            aria-label="cerrar menu"></button>
            <!--cierra el encavezado movil-->
        </div>
        
        <!--cuerpo del menu Flexbox en columan para aplicar logo enlaces y boton de salida-->
        <div class="offcanvas-body d-flex column p-3">
            <!--logo solo se ve en computador-->
            <a href="dashboard.html" class="d-none"
            d-lg-flex align-items-center mb-3
            text-white text-decoration-none fs-5 fw-bold>
            <!--icono verde y nombre-->
            <i class="bi bi-shop me-2 text-sena"></i>Tienda sena
            <!--cierra logo-->
        </a>
        <!--Lista de navegacion en columna (flex-column) .nav-pills da forma de pildora al alncance activo mb-auto empuja lo que sigue hasta el fondo-->
        <ul class="nav nav-pills flex-column mb-auto">
            <!--enlace al dashboard active lo resalta en verde y aria-current="pague" avia a los lectores de pantalla que es la pagina actual en cada modulo el active pasa su propio enlace-->
            <li class="nav-item"><a href="dashboard.html" class="nav-link active" aria-current="page"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a href="usuarios.html" class="nav-link"><i class="bi bi-tags me-2"></i>Usuarios</a></li>
            <li class="nav-item"><a href="categorias.html" class="nav-link"><i class="bi bi-box-seam me-3"></i>categorias</a></li>
        </ul>
        <hr>
        <!--boton que vuelve al login asi se cierra la sesion-->
        <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-left me-1"></i>Cerrar sesion</a>

        </div>
    </aside>
    
</body>
